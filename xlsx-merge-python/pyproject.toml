[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-merge"
version = "0.1.0"
description = "Python wrapper for the .NET XlsxMerge mail-merge library (pythonnet / ClosedXML)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pythonnet>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["xlsx_merge"]
